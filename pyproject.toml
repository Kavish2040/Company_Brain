[project]
name = "company_brain"
version = "0.1.0"
description = "Ingests company artifacts into a markdown knowledge graph that humans and agents both read and write."
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.9",
    "pyyaml>=6.0.2",
    "typer>=0.15",
    "psycopg[binary,pool]>=3.2",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "anthropic>=0.40",
    "openai>=1.60",
    "mcp>=1.2",
    "storage3>=0.9",
    "python-dateutil>=2.9",
    "python-dotenv>=1.2.2",
    "httpx>=0.27",
]

[project.scripts]
company_brain = "company_brain.cli.main:app"
cb = "company_brain.cli.main:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-pyyaml>=6.0",
]
# Document converters are PINNED EXACTLY. Their output is part of the canonical
# markdown store, so a version bump is a reviewed corpus migration, not a
# routine dependency update. See CLAUDE.md and docs/ARCHITECTURE.md §4.
converters = [
    "pypdf==6.7.1",
    "python-docx==1.2.0",
    "mail-parser==4.1.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/company_brain"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not llm' --strict-markers"
# So `tests/index_conformance.py` — the suite both index backends are driven
# through — is importable from tests/unit and tests/integration alike.
pythonpath = ["."]
markers = [
    "unit: no external dependencies (default)",
    "integration: needs a running service (an app, a database)",
    "postgres: needs Postgres + pgvector; `supabase start`, or CB_TEST_DATABASE_URL",
    "llm: makes live model calls; excluded from CI",
    "acceptance: the M1 gate — goldens plus byte-identical re-ingestion",
]

[tool.ruff]
line-length = 96
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
files = ["src/company_brain"]

# Invariant 5 and 6 depend on these packages being airtight.
[[tool.mypy.overrides]]
module = ["company_brain.schemas.*", "company_brain.acl.*", "company_brain.store.*"]
strict = true
